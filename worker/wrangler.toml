name = "fleet-ledger-demo-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Comma-separated list of origins allowed to call this API — the demo frontend
# is deployed to GitHub Pages (smkrmuthu.github.io/FleetAppDemo), the
# Cloudflare Worker `fleetappdemo` behind the custom domain fleet.oneuptech.co,
# and (via Capacitor) the iOS and Android apps, which serve their bundled web
# content from fixed origins regardless of device. Never list the SMT
# production origins (smt.oneuptech.co, fleetapp.smkrmuthu.workers.dev) here:
# this demo API is separate from FleetApp-SMT.
# Turns on the nightly sample-data refresh (src/lib/demoData.ts). It also refuses
# to run unless the organisation is named "Demo Logistics". Never set this on SMT.
[vars]
DEMO_MODE = "true"
ALLOWED_ORIGIN = "https://smkrmuthu.github.io,https://fleet.oneuptech.co,https://fleetappdemo.smkrmuthu.workers.dev,capacitor://localhost,https://localhost,http://localhost:5180"

# Nightly backup at 21:00 UTC (02:30 IST) — see src/lib/backup.ts
[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "DB"
# Demo-only database (created 6 Oct 2026, APAC). Never put the SMT production
# database id (fleet-ledger-db) here.
database_name = "fleet-ledger-demo-db"
database_id = "886fcd84-b0a7-417b-91e9-236f6adde3ce"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "fleet-ledger-demo-docs"

# JWT_SECRET is NOT set here — it's a secret, set once via:
#   npx wrangler secret put JWT_SECRET
# (run from this worker/ directory, after `wrangler login`)
